<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inscritos</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="wrap"><section class="card"><div class="top"><div><h2>Inscritos</h2><p class="small">Total: <b>{{total}}</b></p></div><div class="actions"><a class="linkbtn" href="/admin/exportar.csv">Exportar CSV</a><a class="linkbtn" href="/admin/logout">Sair</a></div></div><div class="tablewrap"><table><thead><tr><th>ID</th><th>Nome</th><th>CPF</th><th>E-mail</th><th>Data</th></tr></thead><tbody>{% for r in inscritos %}<tr><td>{{r.id}}</td><td>{{r.nome}}</td><td>{{r.cpf}}</td><td>{{r.email}}</td><td>{{r.criado_em}}</td></tr>{% else %}<tr><td colspan="5">Nenhuma inscrição ainda.</td></tr>{% endfor %}</tbody></table></div></section></div></body></html>
