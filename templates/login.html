<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área administrativa</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="wrap"><section class="card" style="max-width:430px;margin:70px auto"><h2>Painel administrativo</h2><p class="small">Acesso restrito ao organizador.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><label>Senha administrativa</label><input type="password" name="password" required><button class="btn">Entrar</button></form></section></div></body></html>
